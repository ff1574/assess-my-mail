server {
    listen 80;
    server_name assess-my-mail.onwebapp.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name assess-my-mail.onwebapp.io;

    ssl_certificate /etc/letsencrypt/live/assess-my-mail.onwebapp.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assess-my-mail.onwebapp.io/privkey.pem;

    location / {
        proxy_pass http://localhost:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
